name: Build Webparatus DLSS5 Sidecar V3.2 Fullscreen

on:
  workflow_dispatch:
  push:
    branches: [webparatus-v3.2-fullscreen]
    paths:
      - '.github/workflows/build-webparatus-v32.yml'
      - 'tools/**'
      - 'package/**'
      - 'README.md'

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout Webparatus workspace
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download upstream v0.1.2 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest 'https://github.com/xilla420/dlss5-wow-sidecar/archive/refs/tags/v0.1.2.zip' -OutFile upstream-source.zip
          Expand-Archive upstream-source.zip -DestinationPath upstream-src
          $root = (Get-ChildItem upstream-src -Directory | Select-Object -First 1).FullName
          "UPSTREAM_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Apply Webparatus V3.2 fullscreen patches
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\tools\apply-webparatus-v32-patches.ps1" -SourceRoot "$env:UPSTREAM_ROOT"

      - name: Install CI dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pefile pytest

      - name: Configure x64 Release
        shell: pwsh
        run: cmake -S "$env:UPSTREAM_ROOT" -B "$env:UPSTREAM_ROOT\build" -G "Visual Studio 17 2022" -A x64

      - name: Build x64 Release
        shell: pwsh
        run: cmake --build "$env:UPSTREAM_ROOT\build" --config Release --parallel

      - name: Verify compiled V3.2 markers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = Get-ChildItem "$env:UPSTREAM_ROOT\build" -Recurse -Filter wowsidecar.exe | Where-Object { $_.FullName -match '\\Release\\' } | Select-Object -First 1
          if (-not $runtime) { throw 'wowsidecar.exe not found' }
          $bytes = [IO.File]::ReadAllBytes($runtime.FullName)
          $ascii = [Text.Encoding]::ASCII.GetString($bytes)
          $unicode = [Text.Encoding]::Unicode.GetString($bytes)
          if ($ascii.Contains('RTX 40 or RTX 50 required') -or $unicode.Contains('RTX 40 or RTX 50 required')) {
            throw 'FAILED: old RTX 40/50-only gate is still embedded.'
          }
          if (-not ($ascii.Contains('NVIDIA RTX 20/30/40/50 required') -or $unicode.Contains('NVIDIA RTX 20/30/40/50 required'))) {
            throw 'FAILED: RTX20/30/40/50 marker missing.'
          }
          if (-not ($ascii.Contains('Webparatus DLSS5 Sidecar V3.2') -or $unicode.Contains('Webparatus DLSS5 Sidecar V3.2'))) {
            throw 'FAILED: V3.2 branding marker missing.'
          }
          Get-FileHash $runtime.FullName -Algorithm SHA256 | Format-List

      - name: Verify source fullscreen fallback markers
        shell: pwsh
        run: |
          $wgc = Get-Content "$env:UPSTREAM_ROOT\src\common\capture\WgcSource.cpp" -Raw
          $overlay = Get-Content "$env:UPSTREAM_ROOT\src\common\present\DCompOverlay.cpp" -Raw
          if (-not $wgc.Contains('CreateForMonitor')) { throw 'CreateForMonitor fallback missing' }
          if (-not $overlay.Contains('0x00000011')) { throw 'WDA_EXCLUDEFROMCAPTURE marker missing' }
          Write-Host 'PASS: Windows 10 monitor-capture fallback and capture exclusion present.' -ForegroundColor Green

      - name: Run upstream unit tests
        shell: pwsh
        run: |
          $test = Get-ChildItem "$env:UPSTREAM_ROOT\build" -Recurse -Filter sidecar_tests.exe | Where-Object { $_.FullName -match '\\Release\\' } | Select-Object -First 1
          if (-not $test) { throw 'sidecar_tests.exe not found' }
          & $test.FullName '[unit]'

      - name: Re-check safety imports
        shell: pwsh
        run: |
          $runtime = Get-ChildItem "$env:UPSTREAM_ROOT\build" -Recurse -Filter wowsidecar.exe | Where-Object { $_.FullName -match '\\Release\\' } | Select-Object -First 1
          $manager = Get-ChildItem "$env:UPSTREAM_ROOT\build" -Recurse -Filter wowsidecar-manager.exe | Where-Object { $_.FullName -match '\\Release\\' } | Select-Object -First 1
          $pattern = Get-ChildItem "$env:UPSTREAM_ROOT\build" -Recurse -Filter testpattern.exe | Where-Object { $_.FullName -match '\\Release\\' } | Select-Object -First 1
          if (-not $runtime -or -not $manager -or -not $pattern) { throw 'Expected Release binaries not found' }
          python "$env:UPSTREAM_ROOT\ci\check_imports.py" $runtime.FullName $manager.FullName $pattern.FullName

      - name: Download upstream v0.1.2 runtime bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest 'https://github.com/xilla420/dlss5-wow-sidecar/releases/download/v0.1.2/dlss5-wow-sidecar-v0.1.2.zip' -OutFile upstream-release.zip
          Expand-Archive upstream-release.zip -DestinationPath package-out

      - name: Assemble Webparatus V3.2 fullscreen package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runtimeBuilt = Get-ChildItem "$env:UPSTREAM_ROOT\build" -Recurse -Filter wowsidecar.exe | Where-Object { $_.FullName -match '\\Release\\' } | Select-Object -First 1
          $managerBuilt = Get-ChildItem "$env:UPSTREAM_ROOT\build" -Recurse -Filter wowsidecar-manager.exe | Where-Object { $_.FullName -match '\\Release\\' } | Select-Object -First 1
          $runtimePack = Get-ChildItem "$env:GITHUB_WORKSPACE\package-out" -Recurse -Filter wowsidecar.exe | Select-Object -First 1
          $managerPack = Get-ChildItem "$env:GITHUB_WORKSPACE\package-out" -Recurse -Filter wowsidecar-manager.exe | Select-Object -First 1
          if (-not $runtimeBuilt -or -not $managerBuilt -or -not $runtimePack -or -not $managerPack) { throw 'Required executables not found' }

          Copy-Item $runtimeBuilt.FullName $runtimePack.FullName -Force
          Copy-Item $managerBuilt.FullName $managerPack.FullName -Force

          $builtHash = (Get-FileHash $runtimeBuilt.FullName -Algorithm SHA256).Hash
          $packHash = (Get-FileHash $runtimePack.FullName -Algorithm SHA256).Hash
          if ($builtHash -ne $packHash) { throw 'Packaged runtime hash mismatch' }

          $srcRoot = $managerPack.Directory.FullName
          $dist = "$env:GITHUB_WORKSPACE\dist\Webparatus_DLSS5_Sidecar_V3.2_FULLSCREEN_Win10-Win11_RTX20-50"
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          Copy-Item "$srcRoot\*" $dist -Recurse -Force
          Copy-Item "$env:GITHUB_WORKSPACE\package\SETUP_RTX20_30_RUNTIME.ps1" $dist -Force
          Copy-Item "$env:GITHUB_WORKSPACE\package\SETUP_RTX20_30_RUNTIME.cmd" $dist -Force
          Copy-Item "$env:GITHUB_WORKSPACE\package\LEIA-ME_WEBPARATUS.txt" $dist -Force

          $managerHash = (Get-FileHash $managerBuilt.FullName -Algorithm SHA256).Hash
          @"
          WEBPARATUS DLSS5 SIDECAR V3.2 - FULLSCREEN CAPTURE EDITION
          Developer (Webparatus edition): Klede Marcos Teixeira
          Channel: Webparatus - YouTube
          Base: xilla420/dlss5-wow-sidecar v0.1.2
          Build commit: $env:GITHUB_SHA
          Runtime SHA256: $builtHash
          Manager SHA256: $managerHash
          Windows 10 22H2 path: WGC monitor capture + WDA_EXCLUDEFROMCAPTURE overlay/HUD.
          Windows 11 path: original WGC window capture.
          Intended display mode: WoW Windowed Fullscreen / Borderless at native monitor resolution.
          RTX 20/30 support remains experimental and requires a compatible user-supplied nvngx_dlssnr.dll.
          No files are installed into the World of Warcraft folder.
          "@ | Set-Content (Join-Path $dist 'WEBPARATUS_BUILD_INFO_V3.2.txt') -Encoding UTF8

          @"
          `$ErrorActionPreference = 'Stop'
          `$expected = '$builtHash'
          `$actual = (Get-FileHash (Join-Path `$PSScriptRoot 'wowsidecar.exe') -Algorithm SHA256).Hash
          Write-Host "Expected runtime SHA256: `$expected"
          Write-Host "Actual runtime SHA256:   `$actual"
          if (`$actual -ne `$expected) {
            Write-Host 'FALHA: este nao e o executavel V3.2 verificado.' -ForegroundColor Red
            exit 1
          }
          Write-Host 'OK: Webparatus V3.2 FULLSCREEN verificado.' -ForegroundColor Green
          "@ | Set-Content (Join-Path $dist 'VERIFICAR_BUILD_V3.2.ps1') -Encoding UTF8

          @"
          @echo off
          powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0VERIFICAR_BUILD_V3.2.ps1"
          echo.
          pause
          "@ | Set-Content (Join-Path $dist 'VERIFICAR_BUILD_V3.2.cmd') -Encoding ASCII

          Write-Host "DIST=$dist" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload Webparatus V3.2 package
        uses: actions/upload-artifact@v4
        with:
          name: Webparatus_DLSS5_Sidecar_V3.2_FULLSCREEN_Win10-Win11_RTX20-50
          path: dist/Webparatus_DLSS5_Sidecar_V3.2_FULLSCREEN_Win10-Win11_RTX20-50/**
          if-no-files-found: error
          retention-days: 30
